
FUNC void saveData(int startAddr, int byteLength)
{
	int start;
	exec("log > SaveData.txt");
	for (start = startAddr; start < (startAddr+byteLength); start += 32)
	{
		//printf("0x%02X%02X%02X%02X,0x%02X%02X%02X%02X\t\n", *(start+3),*(start+2),*(start+1),*(start+0),*(start+7),*(start+6),*(start+5),*(start+4));
		printf("0x%08X,0x%08X,0x%08X,0x%08X,", _RDWORD(start), _RDWORD(start+4), _RDWORD(start+8), _RDWORD(start+12));
		printf("0x%08X,0x%08X,0x%08X,0x%08X,\t\n", _RDWORD(start+16), _RDWORD(start+20), _RDWORD(start+24), _RDWORD(start+28));
	}
	exec("log off");
}

FUNC void saveDataF(int startAddr, int len)
{
    int start;
    exec("log > saveDataF.txt");
    start = startAddr;
    while (len > 0)
    {
        printf("%f", _RDWORD(start));
        len--;
        start += 4;
    }
    exec("log off");
}

